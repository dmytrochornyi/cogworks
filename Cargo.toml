[package]
name = "cogworks"
version = "0.2.0"
edition = "2024"
description = "A cozy automation game: mine, build belts and machines, research, and wake the Grand Engine."
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Dmytro Chornyi"]
default-run = "cogworks"

[dependencies]
glam = { version = "0.27", features = ["serde"] }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
