name: Release

# Push a tag like `v0.1.0` to build every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04,  target: x86_64-unknown-linux-gnu, exe: cogworks }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc,  exe: cogworks.exe }
          - { name: macos-arm64,    os: macos-14,       target: aarch64-apple-darwin,     exe: cogworks }
          - { name: macos-x86_64,   os: macos-14,       target: x86_64-apple-darwin,      exe: cogworks }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Test
        if: matrix.name != 'macos-x86_64'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --bin cogworks --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          dir="cogworks-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE "$dir/"
          cp assets/fonts/OFL.txt "$dir/FONT-LICENSE.txt"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cogworks-*.*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=""
            case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* --title "Cogworks $GITHUB_REF_NAME" --notes-file "$notes" $flags
          fi
